{% extends "reports/report_base.html" %}
{% load i18n %}
{% block title %}
    {% trans "Pumping" %} - {{ object }}
{% endblock %}
{% block breadcrumbs %}
    <li class="breadcrumb-item">
        <a href="{% url "core:parent-list" %}">{% trans "Parents" %}</a>
    </li>
    <li class="breadcrumb-item">
        <a href="{% url "core:parent" object.slug %}">{{ object }}</a>
    </li>
    <li class="breadcrumb-item active" aria-current="page">{% trans "Pumping" %}</li>
{% endblock %}
